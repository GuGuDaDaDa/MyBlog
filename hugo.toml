baseURL = 'https://blog.gugudada.cn/'
title = 'BuGuLog'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
summaryLength = 100
disableKinds = ['taxonomy', 'RSS']
buildDrafts = false
buildFuture = false
buildExpired = false
theme = 'night-theme'

[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

[taxonomies]
tag = 'tags'
[pagination]
pagerSize = 12
path = 'page'
[outputs]
home = ['HTML', 'Search']
section = ['HTML']
term = ['HTML']
page = ['HTML']
[outputFormats.Search]
mediaType = 'application/json'
baseName = 'index'
isPlainText = true
notAlternative = true
[frontmatter]
date = ['date']
publishDate = ['publishDate', 'date']
lastmod = ['lastmod', 'date']
expiryDate = ['expiryDate']
[module.hugoVersion]
min = '0.165.0'
extended = true

# Feed author content to the adapter without generating duplicate native pages.
[[module.mounts]]
source = 'content'
target = 'assets/night-content'
[[module.mounts]]
source = 'content'
target = 'content'
files = ['! **']
[[module.mounts]]
source = 'assets'
target = 'assets'
[params]
description = '记录技术实践、游戏体验，和偶尔冒出来的奇思妙想。'
author = 'GuGuDaDa'
footerText = '海雾深处，字字为灯'
defaultSocialImage = ''
googleAnalytics = 'G-7F750CT9XH'
logo = '/logo.svg'
avatar = '/avatar.png'
favicon = '/favicon.ico'

[menus]
[[menus.main]]
name = '关于'
pageRef = '/about'
weight = 10
[[menus.main]]
name = '友链'
pageRef = '/friends'
weight = 20

[params.comments]
api_base = 'https://blog.gugudada.cn'
site_id = 'MyBlog'
emoji = ['/emoji/void.json', 'https://emoticons.assets.hzchu.top/json/owo/bili_tv.json', 'https://emoticons.assets.hzchu.top/json/owo/rxy.json', 'https://emoticons.assets.hzchu.top/json/owo/fluentui-emoji-face.json']
# Standalone pages: set to true to show comments on /about/ or /friends/ (default off).
about = false
friends = true

[params.social]
github = 'https://github.com/GuGuDaDaDa'
email = 'mailto:shiki.wooi@gmail.com'