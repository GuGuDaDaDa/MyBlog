{{- $summary := .Get 0 | default (.Get "summary") | default "详情" -}}
<details class="fold" style="border:1px solid var(--color-border,#3336);border-radius:.5em;padding:.5em 1em;margin:1em 0;">
  <summary class="fold-label" style="cursor:pointer;font-weight:600;">{{ $summary }}</summary>
  <div class="fold-body" style="margin-top:.5em;">
    {{- .Inner | markdownify -}}
  </div>
</details>
